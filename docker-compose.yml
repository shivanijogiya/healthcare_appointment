# Local dependencies only. The API, worker and web app run on the host via
# `npm run dev` so you get fast reloads; this just supplies Postgres and Redis.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ham-postgres
    environment:
      POSTGRES_USER: ham
      POSTGRES_PASSWORD: ham
      POSTGRES_DB: ham
    ports: ['5432:5432']
    volumes: ['ham-pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ham -d ham']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ham-redis
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ham-pgdata:
