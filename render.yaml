services:
  - type: web
    name: ham-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm run render:build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLINIC_TIMEZONE_OFFSET_MINUTES
        value: "330"
      - key: MAIL_TRANSPORT
        value: file
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ham-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ham-redis
          property: connectionString

  - type: worker
    name: ham-worker
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm run render:build
    startCommand: node apps/api/dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLINIC_TIMEZONE_OFFSET_MINUTES
        value: "330"
      - key: MAIL_TRANSPORT
        value: file
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ham-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ham-redis
          property: connectionString

databases:
  - name: ham-postgres
    databaseName: ham
    user: ham
    plan: free
    region: oregon
    postgresMajorVersion: 16
